name: capstone
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: capstone-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: make install
      - run: make lint

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Install checksum-verified Gitleaks
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum --check
          sudo tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
      - run: gitleaks git . --redact --log-opts="--all"
      - run: gitleaks dir . --redact

  test:
    needs: [lint, secrets]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: make install
      - run: make test-fast
      - run: make test-slow
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage
          path: coverage.xml

  image-smoke:
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Build, enforce size, and exercise the real stack
        run: |
          docker build --label org.opencontainers.image.source=https://github.com/${{ github.repository }} -t rasheed-capstone:dev .
          SIZE=$(docker image inspect rasheed-capstone:dev --format '{{.Size}}')
          test "$SIZE" -le 500000000
          docker compose up -d --no-build --wait
          python scripts/smoke.py
          test "$(docker compose exec -T rasheed-api id -un)" = "appuser"
          python scripts/operations_check.py
          docker save rasheed-capstone:dev -o /tmp/rasheed-image.tar
      - name: Show logs and clean up
        if: always()
        run: |
          docker compose logs --no-color
          docker compose down --remove-orphans
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tested-image
          path: /tmp/rasheed-image.tar
          retention-days: 3

  publish:
    needs: [image-smoke]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: tested-image
          path: /tmp/image
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image with immutable commit identity
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}:$COMMIT_SHA"
          docker load -i /tmp/image/rasheed-image.tar
          docker tag rasheed-capstone:dev "$IMAGE"
          docker push "$IMAGE"
          echo "Published: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
