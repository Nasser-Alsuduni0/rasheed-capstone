name: rasheed-capstone
services:
  feature-cache:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
    restart: unless-stopped
    mem_limit: 128m
  rasheed-api:
    image: ${RASHEED_IMAGE:-rasheed-capstone:dev}
    build:
      context: .
      target: runtime
    init: true
    ports:
      - "127.0.0.1:${RASHEED_PORT:-8010}:8000"
    environment:
      RASHEED_REDIS_URL: redis://feature-cache:6379/0
      RASHEED_LOG_LEVEL: INFO
    depends_on:
      feature-cache:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    stop_grace_period: 15s
    restart: unless-stopped
